<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crop Recommendation</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">


<style>

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
 font-family:'Inter',sans-serif;
}


body{

background:url("{{ url_for('static', filename=bg_image) }}")
no-repeat center center fixed;

background-size:cover;

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:2rem;

}


.container{

background:white;

padding:2rem 2.5rem;

border-radius:20px;

box-shadow:
0 8px 24px rgba(0,0,0,0.1);

max-width:500px;

width:100%;

}


h2{

margin-bottom:1.5rem;

color:#2e7d32;

font-size:1.8rem;

}


input{

width:100%;

padding:0.75rem;

margin:0.5rem 0;

border-radius:12px;

border:1px solid #ccc;

background:#f1f8e9;

font-size:1rem;

}


button{

width:100%;

padding:0.9rem;

margin-top:1rem;

background:#4caf50;

color:white;

border:none;

border-radius:12px;

font-size:1rem;

font-weight:600;

cursor:pointer;

}


button:hover{

background:#388e3c;

}


#result{

margin-top:1.5rem;

font-size:1.1rem;

color:#2e7d32;

font-weight:600;

}


</style>

</head>



<body>


<div class="container">


<h2>🌱 Crop Recommendation</h2>


<input 
type="number"
id="nitrogen"
placeholder="Nitrogen (N)"
>


<input 
type="number"
id="phosphorus"
placeholder="Phosphorus (P)"
>


<input 
type="number"
id="potassium"
placeholder="Potassium (K)"
>


<input 
type="number"
id="temperature"
placeholder="Temperature (°C)"
>


<input 
type="number"
id="humidity"
placeholder="Humidity (%)"
>


<input 
type="number"
step="0.1"
id="ph"
placeholder="Soil pH"
>


<input 
type="number"
id="rainfall"
placeholder="Rainfall (mm)"
>



<button onclick="predictCrop()">

Recommend Crop

</button>



<div id="result"></div>


</div>





<script>


function predictCrop(){


const data={


"N":parseFloat(
document.getElementById("nitrogen").value
),


"P":parseFloat(
document.getElementById("phosphorus").value
),


"K":parseFloat(
document.getElementById("potassium").value
),


"temperature":parseFloat(
document.getElementById("temperature").value
),


"humidity":parseFloat(
document.getElementById("humidity").value
),


"ph":parseFloat(
document.getElementById("ph").value
),


"rainfall":parseFloat(
document.getElementById("rainfall").value
)


};




fetch(
"/crop_recommendation",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(data)

}

)


.then(response=>response.json())


.then(result=>{


if(result["Recommended Crop"]){


document.getElementById("result").innerText =
"🌾 Recommended Crop: "
+
result["Recommended Crop"];


}

else{


document.getElementById("result").innerText =
"No recommendation available";


}


})


.catch(error=>{


console.log(error);


document.getElementById("result").innerText =
"Error occurred";


});


}


</script>


</body>

</html>
